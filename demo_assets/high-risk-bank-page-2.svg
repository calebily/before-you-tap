<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fictional Harbourline Bank security alert, page two</title>
  <desc id="desc">A fictional message requests a verification code, a transfer to a safety account, and secrecy.</desc>
  <rect width="900" height="1200" fill="#f3f5f8"/>
  <rect x="65" y="55" width="770" height="1090" rx="24" fill="#ffffff" stroke="#d7dce3" stroke-width="3"/>
  <rect x="65" y="55" width="770" height="145" rx="24" fill="#12315b"/>
  <rect x="65" y="175" width="770" height="25" fill="#12315b"/>
  <circle cx="145" cy="125" r="38" fill="#ffffff"/>
  <path d="M125 151 V100 L145 85 L165 100 V151 H151 V125 H139 V151 Z" fill="#12315b"/>
  <text x="210" y="120" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">HARBOURLINE BANK</text>
  <text x="210" y="158" font-family="Arial, sans-serif" font-size="20" fill="#dce8f8">Final verification step</text>

  <text x="115" y="290" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#111827">Protect your account now</text>
  <text x="115" y="360" font-family="Arial, sans-serif" font-size="26" fill="#1f2937">Complete both steps before the timer expires:</text>

  <circle cx="145" cy="445" r="30" fill="#12315b"/>
  <text x="145" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">1</text>
  <text x="195" y="435" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Reply with your six-digit security code</text>
  <text x="195" y="478" font-family="Arial, sans-serif" font-size="23" fill="#4b5563">This confirms that you are the account owner.</text>

  <circle cx="145" cy="585" r="30" fill="#12315b"/>
  <text x="145" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">2</text>
  <text x="195" y="565" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Move your balance to the Safety Account</text>
  <text x="195" y="608" font-family="Arial, sans-serif" font-size="23" fill="#4b5563">Temporary account: 000-111 / 12345678</text>
  <text x="195" y="645" font-family="Arial, sans-serif" font-size="23" fill="#4b5563">Your funds will be returned after review.</text>

  <rect x="115" y="735" width="670" height="205" rx="16" fill="#fff1f0" stroke="#e68078" stroke-width="2"/>
  <text x="145" y="793" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9f1c14">Keep this process confidential</text>
  <text x="145" y="845" font-family="Arial, sans-serif" font-size="23" fill="#1f2937">Do not tell family members or bank staff.</text>
  <text x="145" y="885" font-family="Arial, sans-serif" font-size="23" fill="#1f2937">Another person may cancel the protection and</text>
  <text x="145" y="925" font-family="Arial, sans-serif" font-size="23" fill="#1f2937">cause your account to be permanently blocked.</text>

  <text x="450" y="1090" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">Fictional demonstration message · Page 2 of 2</text>
</svg>
