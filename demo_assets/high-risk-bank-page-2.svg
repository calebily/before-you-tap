<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fictional bank scam text conversation, page two</title>
  <desc id="desc">A realistic fictional phone message asks for a security code, a transfer to a safety account, and secrecy.</desc>
  <rect width="900" height="1200" fill="#e8eaed"/>
