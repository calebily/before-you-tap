  <line x1="126" y1="270" x2="774" y2="270" stroke="#e5e5e7" stroke-width="2"/>

  <text x="450" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="600" fill="#8a8a8e">Today 9:41 AM</text>

  <rect x="160" y="350" width="548" height="125" rx="30" fill="#e9e9eb"/>
  <text x="190" y="392" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="27" fill="#111111">Harbourline: We detected an unusual</text>
  <text x="190" y="432" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="27" fill="#111111">$1,280 transfer from your account.</text>

  <rect x="160" y="495" width="560" height="165" rx="30" fill="#e9e9eb"/>
  <text x="190" y="538" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="27" fill="#111111">Your account will be locked in</text>
  <text x="190" y="578" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="27" fill="#111111">30 minutes unless you verify the</text>
  <text x="190" y="618" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="27" fill="#111111">transfer now.</text>

